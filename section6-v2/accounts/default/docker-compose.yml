services:
  config-server:
    image: saqlenpasha1/config-server:v1
    container_name: configserver-ms
    ports:
      - "8071:8071"
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - easybank
  accounts:
    image: saqlenpasha1/accounts:v1
    container_name: accounts
    ports:
      - "8080:8080"
    deploy:
      resources:
            limits:
              memory: 700M
    networks:
      - easybank	
    environment:
      SPRRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8071/"
  cards:
    image: saqlenpasha1/cards:v1
    container_name: cards
    ports:
     - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - easybank
    environment:
      SPRRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: "cards"
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8071/"
  loans:
    image: saqlenpasha1/loans:v1
    container_name: loans
    ports:
     - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - easybank
    environment:
      SPRRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: "loans"
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8071/"
networks:
  easybank:
   driver: "bridge"
